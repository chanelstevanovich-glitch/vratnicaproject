        'Greetings': ['hello', 'goodbye', 'good morning', 'good evening', 'good afternoon', 'welcome', 'hi', 'bye', 'see you'],

        'Verbs': ['to be', 'to have', 'to go', 'to come', 'to eat', 'to drink', 'to work', 'to study', 'to live', 'to speak'],

        'Animals': ['dog', 'cat', 'bird', 'horse', 'cow', 'pig', 'chicken', 'sheep', 'goat', 'fish']
      };

      // Find matching category
      for (const [category, keywords] of Object.entries(categories)) {
        if (keywords.some(kw => english.includes(kw))) {
          return category;
        }
      }

      // Default based on word structure
      if (english.startsWith('to ')) return 'Verbs';
      if (english.includes('?')) return 'Questions';
      
      return 'General';
    };

      // Audio Recording State
      const [isRecording, setIsRecording] = useState(false);

      const [allAudioRecordings, setAllAudioRecordings] = useState([]);
      const [playingAudio, setPlayingAudio] = useState(null);
      const [recordingTime, setRecordingTime] = useState(0);

      // AI Contribution State
      const [aiContribution, setAiContribution] = useState('');
      const [aiProcessing, setAiProcessing] = useState(false);
      const [aiResult, setAiResult] = useState(null);
      
      // Suggestion/Recommendation state
      const [showSuggestionModal, setShowSuggestionModal] = useState(false);
      const [suggestionWord, setSuggestionWord] = useState(null);
      const [suggestions, setSuggestions] = useState([]);
      const suggestionFormRef = useRef({
        suggestedVratnicki: '',
        suggestedCyrillic: '',
        suggestedNotes: '',
        reason: ''
      });

      // ========================================
      // SUGGESTION FUNCTIONS
      // ========================================
      
      const openSuggestionModal = (word) => {
        setSuggestionWord(word);
        suggestionFormRef.current = {
          suggestedVratnicki: word.vratnicki || word.vratnica || '',
          suggestedCyrillic: word.cyrillic || '',
          suggestedNotes: word.notes || '',
          reason: ''
        };
        setShowSuggestionModal(true);
      };
      
      const submitSuggestion = async () => {
        if (!suggestionWord) return;
        
        const form = suggestionFormRef.current;
        if (!form.reason.trim()) {
          showNotification('Please provide a reason for your suggestion', 'error');
          return;
        }
        
        try {
          await db.collection('suggestions').add({
            wordId: suggestionWord.id,
            originalEnglish: suggestionWord.english,
            originalVratnicki: suggestionWord.vratnicki || suggestionWord.vratnica,
            originalCyrillic: suggestionWord.cyrillic,
            originalNotes: suggestionWord.notes,
            suggestedVratnicki: form.suggestedVratnicki,
            suggestedCyrillic: form.suggestedCyrillic,
            suggestedNotes: form.suggestedNotes,
            reason: form.reason,
            status: 'pending',
            dateSubmitted: new Date().toISOString()
          });
          
          showNotification('Thank you! Your suggestion has been submitted for review.', 'success');
          setShowSuggestionModal(false);
          setSuggestionWord(null);
        } catch (error) {
          console.error('Error submitting suggestion:', error);
          showNotification('Error submitting suggestion: ' + error.message, 'error');
        }
      };
      
      const approveSuggestion = async (suggestion) => {
        try {
          // Update the word with suggested changes
          await db.collection('vocabulary').doc(suggestion.wordId).update({
            vratnicki: suggestion.suggestedVratnicki,
            cyrillic: suggestion.suggestedCyrillic,
            notes: suggestion.suggestedNotes
          });
          
          // Mark suggestion as approved
          await db.collection('suggestions').doc(suggestion.id).update({
            status: 'approved',
            dateReviewed: new Date().toISOString()
          });
          
          showNotification('Suggestion approved and word updated!', 'success');
        } catch (error) {
          console.error('Error approving suggestion:', error);
          showNotification('Error: ' + error.message, 'error');
        }
      };
      
      const rejectSuggestion = async (suggestionId) => {
        try {
          await db.collection('suggestions').doc(suggestionId).update({
            status: 'rejected',
            dateReviewed: new Date().toISOString()
          });
          showNotification('Suggestion rejected', 'info');
        } catch (error) {
          console.error('Error rejecting suggestion:', error);
        }
      };

      // ========================================
      // AUDIO RECORDING FUNCTIONS
      // ========================================
      
      // Start recording for a specific word
      const startRecording = async (wordId) => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorderRef.current = new MediaRecorder(stream);
          audioChunksRef.current = [];
          
          mediaRecorderRef.current.ondataavailable = (event) => {
            audioChunksRef.current.push(event.data);
          };
          
          mediaRecorderRef.current.onstop = async () => {
            const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
            stream.getTracks().forEach(track => track.stop());
            
            // Upload to Firebase Storage
            await uploadAudio(wordId, audioBlob);
          };
          
          mediaRecorderRef.current.start();
          setIsRecording(true);
          setRecordingWordId(wordId);
          setRecordingTime(0);
          
          // Start timer
          recordingTimerRef.current = setInterval(() => {
            setRecordingTime(prev => {
              if (prev >= 10) {
                stopRecording();
                return prev;
              }
              return prev + 1;
            });
          }, 1000);
          
        } catch (error) {
          console.error('Error starting recording:', error);
          showNotification('Microphone access denied. Please allow microphone access.', 'error');
        }
      };
      
      // Stop recording
      const stopRecording = () => {
        if (mediaRecorderRef.current && isRecording) {
          mediaRecorderRef.current.stop();
          setIsRecording(false);
          setRecordingWordId(null);
          if (recordingTimerRef.current) {
            clearInterval(recordingTimerRef.current);
          }
        }
      };
      
      // Upload audio to Firebase Storage
      const uploadAudio = async (wordId, audioBlob) => {
        try {
          showNotification('Uploading recording...', 'info');
          
          const fileName = `audio/${wordId}_${Date.now()}.webm`;
          const storageRef = storage.ref(fileName);
          
          await storageRef.put(audioBlob);
          const downloadURL = await storageRef.getDownloadURL();
          
          // Save audio reference to Firestore
          await db.collection('audioRecordings').add({
            wordId: wordId,
            audioURL: downloadURL,
            fileName: fileName,
            uploadedAt: new Date().toISOString(),
            approved: false, // Requires admin approval
            uploadedBy: 'community'
          });
          
          // Update local state
          setAudioURLs(prev => ({
            ...prev,
            [wordId]: [...(prev[wordId] || []), { url: downloadURL, approved: false }]
          }));
          
          showNotification('Recording uploaded! Pending approval.', 'success');
        } catch (error) {
          console.error('Error uploading audio:', error);
          showNotification('Failed to upload recording. Please try again.', 'error');
        }
      };
      
      // Play audio
      const playAudio = (url, wordId) => {
        if (audioElementRef.current) {
          audioElementRef.current.pause();
        }
        
        audioElementRef.current = new Audio(url);
        audioElementRef.current.onended = () => setPlayingAudio(null);
        audioElementRef.current.onerror = () => {
          showNotification('Error playing audio', 'error');
          setPlayingAudio(null);
        };
        
        setPlayingAudio(wordId);
        audioElementRef.current.play();
      };
      
      // Stop playing audio
      const stopAudio = () => {
        if (audioElementRef.current) {
          audioElementRef.current.pause();
          audioElementRef.current.currentTime = 0;
        }
        setPlayingAudio(null);
      };

      // Approve audio recording (admin function)
      const approveAudio = async (audioId) => {
        try {
          await db.collection('audioRecordings').doc(audioId).update({
            approved: true,
            approvedAt: new Date().toISOString()
          });
          showNotification('Audio recording approved!', 'success');
        } catch (error) {
          console.error('Error approving audio:', error);
          showNotification('Failed to approve audio', 'error');
        }
      };

      // Delete audio recording (admin function)
      const deleteAudio = async (audioId, fileName) => {
        try {
          // Delete from Firestore
          await db.collection('audioRecordings').doc(audioId).delete();
          
          // Try to delete from Storage (may fail if file doesn't exist)
          if (fileName && storage) {
            try {
              await storage.ref(fileName).delete();
            } catch (storageError) {
              console.log('Storage file may already be deleted:', storageError);
            }
          }
          
          showNotification('Audio recording deleted', 'success');
        } catch (error) {
          console.error('Error deleting audio:', error);
          showNotification('Failed to delete audio', 'error');
        }
      };

      const processAIContribution = async () => {
        if (!aiContribution.trim()) {
          showNotification('Please enter some content to contribute', 'error');
          return;
        }
        
        setAiProcessing(true);
        setAiResult(null);
        
        try {
          const response = await fetch("https://api.anthropic.com/v1/messages", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              model: "claude-sonnet-4-20250514",
              max_tokens: 1000,
              messages: [
                { 
                  role: "user", 
                  content: `You are analyzing a user contribution to the Vratnica Language Platform, which preserves the Vratnički dialect (a Torlak dialect from North Macedonia).

Analyze the following contribution and classify it into ONE of these categories:
- "vocabulary" - A word or phrase with translation (extract: english, vratnicki/cyrillic, pronunciation, example, notes, category like Greetings/Family/Food/etc)
- "grammar" - A grammar rule, conjugation pattern, or linguistic structure explanation
- "research" - An academic reference, research finding, linguistic insight, or historical fact about the dialect
- "tip" - A learning tip, pronunciation advice, or usage note

User contribution:
"${aiContribution}"

Respond ONLY with valid JSON in this exact format, nothing else:
{
  "category": "vocabulary|grammar|research|tip",
  "confidence": 0.0-1.0,
  "extracted": {
    // For vocabulary: { "english": "", "vratnicki": "", "cyrillic": "", "pronunciation": "", "example": "", "notes": "", "wordCategory": "Greetings|Family|Food|Numbers|Common Phrases|Other" }
    // For grammar: { "title": "", "explanation": "", "examples": [] }
    // For research: { "title": "", "content": "", "source": "" }
    // For tip: { "title": "", "content": "", "relatedTo": "pronunciation|vocabulary|grammar|general" }
  },
  "summary": "Brief description of what was detected"
}`
                }
              ],
            })
          });

          const data = await response.json();
          const textContent = data.content?.find(item => item.type === "text")?.text || "";
          
          // Parse the JSON response
          let parsed;
          try {
            // Clean up any markdown formatting
            const cleanJson = textContent.replace(/```json\n?|\n?```/g, '').trim();
            parsed = JSON.parse(cleanJson);
          } catch (parseError) {
            console.error('Failed to parse AI response:', textContent);
            showNotification('AI could not understand the contribution format', 'error');
            setAiProcessing(false);
            return;
          }
          
          setAiResult(parsed);
          
          // Add to appropriate Firebase collection
          if (parsed.category === 'vocabulary' && parsed.extracted) {

              english: parsed.extracted.english || '',

              cyrillic: parsed.extracted.cyrillic || parsed.extracted.vratnicki || '',
              transliteration: parsed.extracted.pronunciation || '',
              example: parsed.extracted.example || '',
              notes: parsed.extracted.notes || '',
              category: parsed.extracted.wordCategory || 'Other',
              level: 'Beginner',

              source: 'ai-contribution'
            };
            await db.collection('vocabulary').add(vocabEntry);
            showNotification('Vocabulary word added! Pending approval.', 'success');

              examples: parsed.extracted.examples || [],

              source: 'ai-contribution'

            await db.collection('grammar').add(grammarEntry);
            showNotification('Grammar note added! Pending approval.', 'success');

            await db.collection('research').add(researchEntry);

          filtered = filtered.filter(w => w.category === selectedCategory);
        }
        
        // Apply search filter
        if (searchQuery.trim()) {
          const query = searchQuery.toLowerCase().trim();
          filtered = filtered.filter(w => 
            (w.english && w.english.toLowerCase().includes(query)) ||
            (w.vratnica && w.vratnica.toLowerCase().includes(query)) ||
            (w.vratnicki && w.vratnicki.toLowerCase().includes(query)) ||
            (w.cyrillic && w.cyrillic.toLowerCase().includes(query)) ||
            (w.notes && w.notes.toLowerCase().includes(query))
          );
        }
        
        return filtered;
      };

        const words = getFilteredWords();

          showNotification('Need at least 4 words to play!', 'error');
          return;

        setGameMode(mode);
        setCurrentCardIndex(0);
        setScore(0);
        setIsFlipped(false);
        if (mode === 'quiz') {
          generateQuizOptions(words, 0);
        }
      };

      const generateQuizOptions = (words, index) => {
        const correctWord = words[index];
        const otherWords = words.filter((_, i) => i !== index);
        const shuffled = otherWords.sort(() => Math.random() - 0.5).slice(0, 3);
        const options = [...shuffled, correctWord].sort(() => Math.random() - 0.5);
        setQuizOptions(options);
        setQuizAnswer(null);
      };

      const handleQuizAnswer = (word) => {
        const words = getFilteredWords();
        const correct = word.id === words[currentCardIndex].id;
        setQuizAnswer({ word, correct });
        
        if (correct) {
          setScore(s => s + 1);
        }

        setTimeout(() => {
          if (currentCardIndex < words.length - 1) {
            setCurrentCardIndex(i => i + 1);
            generateQuizOptions(words, currentCardIndex + 1);
          } else {
            setGameMode('results');
          }
        }, 1500);
      };

        const words = getFilteredWords();

        // Render quiz

          const handleAnswer = (qIndex, aIndex) => {
            if (quizSubmitted) return;
            setQuizAnswers({ ...quizAnswers, [qIndex]: aIndex });
          };

          const submitQuiz = () => {
            setQuizSubmitted(true);
            const correct = quiz.filter((q, i) => quizAnswers[i] === q.correct).length;
            const earnedXp = correct * 25;
            if (currentLesson) {
              completeLesson(currentLesson.id, earnedXp);

          const score = quiz.filter((q, i) => quizAnswers[i] === q.correct).length;

                        bgClass = 'bg-vratnica-teal/20 border-vratnica-teal';
                      }
                      return (
                        <button
                          key={oIndex}
                          onClick={() => handleAnswer(qIndex, oIndex)}
                          className={`w-full text-left p-3 rounded-lg border-2 border-transparent transition-all ${bgClass}`}
                          disabled={quizSubmitted}
                        >
                          {opt}
                        </button>
                      );
                    })}
                  </div>
                  {quizSubmitted && q.explanation && (
                    <div className="mt-4 p-3 bg-blue-50 rounded-lg text-sm text-blue-700">
                      {q.explanation}
                    </div>
                  )}
                </div>
              ))}

              {!quizSubmitted ? (
                <button
                  onClick={submitQuiz}
                  disabled={Object.keys(quizAnswers).length < quiz.length}
                  className="w-full bg-vratnica-teal hover:bg-vratnica-teal-dark text-white py-4 rounded-xl font-medium disabled:opacity-50 disabled:cursor-not-allowed"
                >
                  Submit Answers
                </button>
              ) : (
                <div className="text-center">
                  <div className="text-3xl font-display text-vratnica-teal mb-2">
                    {score}/{quiz.length} Correct!
                  </div>
                  <div className="text-vratnica-text/60 mb-4">+{score * 25} XP earned</div>
                  <button
                    onClick={() => {
                      setCurrentLesson(null);
                      setQuizMode(false);
                      setQuizSubmitted(false);
                      setQuizAnswers({});
                    }}
                    className="bg-vratnica-teal hover:bg-vratnica-teal-dark text-white px-8 py-3 rounded-xl font-medium"

                    Continue Learning
                  </button>
                </div>
              )}
            </div>
          );
        };

        // Level selector
        const levelColors = {
          'A1': 'bg-green-500',
          'A2': 'bg-blue-500',
          'B1': 'bg-purple-500',
          'B2': 'bg-red-500'
        };

        // Grammar Reference Data (from original Grammar page)
        const grammarTopics = {
          pronouns: {
            title: 'Personal Pronouns',
            icon: '👤',

            ],

          },
          daConstruction: {

            icon: '🎯',
            content: [
              { vratnicki: 'Сакам да идем', english: 'I want to go', notes: 'NO infinitive!' },

      const CoursesPage = () => {

        const [progress, setProgress] = useState(() => {

          catch { return {}; }

        // Save progress helper
        const saveProgress = (lessonId, score) => {
          const newProgress = { ...progress, [lessonId]: { completed: true, score, timestamp: Date.now() } };
          setProgress(newProgress);
          localStorage.setItem('vratnica-course-progress', JSON.stringify(newProgress));
        };

        // Get words for a lesson
        const getWordsForLesson = (lesson) => {
          if (!lesson) return [];
          let words = vocabulary;
          if (lesson.category) {
            words = words.filter(w => w.category === lesson.category);
          }
          if (lesson.categories && lesson.categories.length > 0) {
            words = words.filter(w => lesson.categories.includes(w.category));
          }
          const shuffled = [...words].sort(() => Math.random() - 0.5);
          return shuffled.slice(0, lesson.maxWords || 10);
        };

        // Calculate section progress
        const getSectionProgress = (section) => {
          if (!section?.units) return 0;
          const total = section.units.reduce((acc, u) => acc + (u.lessons?.length || 0), 0);
          const completed = section.units.reduce((acc, u) => 
            acc + (u.lessons?.filter(l => progress[l.id]?.completed).length || 0), 0);
          return total > 0 ? Math.round((completed / total) * 100) : 0;
        };

        // ========== EXERCISE COMPONENTS ==========
        
        // Vocabulary Introduction
        const VocabIntro = ({ words, onComplete }) => {
          const [idx, setIdx] = useState(0);
          if (!words?.length) return (
            <div className="text-center py-12">
              <p className="text-vratnica-text/60 mb-4">No vocabulary available for this lesson yet.</p>
              <button onClick={() => onComplete(10)} className="bg-vratnica-teal text-white px-6 py-3 rounded-xl">Continue</button>
            </div>
          );
          const word = words[idx];
          return (
            <div className="animate-fade-in" key={idx}>
              <div className="mb-4 text-sm text-vratnica-text/60">Word {idx + 1} of {words.length}</div>
              <div className="w-full bg-gray-200 rounded-full h-2 mb-6">

                <div className="border-t border-gray-100 my-4" />
                <div className="text-sm text-vratnica-text/50 mb-2 uppercase">English</div>
                <div className="text-2xl text-vratnica-text font-medium">{word.english}</div>
                <div className="mt-4">
                  <span className="inline-block bg-vratnica-cream px-3 py-1 rounded-full text-sm text-vratnica-text/60">{word.category}</span>
                </div>
              </div>
              <button
                onClick={() => idx < words.length - 1 ? setIdx(idx + 1) : onComplete(words.length * 2)}
                className="w-full bg-vratnica-teal hover:bg-vratnica-teal-dark text-white py-4 rounded-xl font-medium text-lg"
              >
                {idx < words.length - 1 ? 'Next Word' : 'Complete Lesson'}
              </button>
            </div>
          );
        };

        // Matching Exercise
        const MatchingExercise = ({ words, onComplete }) => {
          const [selectedLeft, setSelectedLeft] = useState(null);
          const [matches, setMatches] = useState({});
          const [shuffledRight, setShuffledRight] = useState([]);
          const [wrong, setWrong] = useState(null);

          useEffect(() => {
            if (words?.length) setShuffledRight([...words].sort(() => Math.random() - 0.5));
          }, []);

          if (!words?.length) return (
            <div className="text-center py-12">
              <p className="text-vratnica-text/60 mb-4">No vocabulary available.</p>
              <button onClick={() => onComplete(10)} className="bg-vratnica-teal text-white px-6 py-3 rounded-xl">Continue</button>
            </div>
          );

          const handleRight = (word) => {
            if (selectedLeft !== null && !matches[word.id]) {
              if (words[selectedLeft].id === word.id) {
                const newMatches = { ...matches, [word.id]: true };
                setMatches(newMatches);
                setSelectedLeft(null);
                if (Object.keys(newMatches).length === words.length) setTimeout(() => onComplete(words.length * 5), 500);
              } else {
                setWrong(word.id);
                setTimeout(() => { setWrong(null); setSelectedLeft(null); }, 800);
              }
            }
          };

          return (
            <div className="animate-fade-in">
              <div className="text-center mb-6">
                <h3 className="font-display text-2xl text-vratnica-teal mb-2">Match the Words</h3>
                <p className="text-vratnica-text/60 text-sm">Tap a word on the left, then its English meaning on the right</p>
                <p className="text-sm text-vratnica-gold mt-2">{Object.keys(matches).length} / {words.length} matched</p>
              </div>
              <div className="grid grid-cols-2 gap-4">
                <div className="space-y-3">
                  {words.map((w, i) => (
                    <button key={`l-${w.id}`} onClick={() => !matches[w.id] && setSelectedLeft(i)}
                      disabled={matches[w.id]}
                      className={`w-full p-4 rounded-xl text-left font-medium transition-all ${
                        matches[w.id] ? 'bg-green-100 text-green-700 border-2 border-green-300' :
                        selectedLeft === i ? 'bg-vratnica-teal text-white shadow-lg' :
                        'bg-white hover:bg-vratnica-cream border-2 border-gray-200 hover:border-vratnica-teal'
                      }`}>{w.vratnicki || w.cyrillic}</button>
                  ))}
                </div>
                <div className="space-y-3">
                  {shuffledRight.map(w => (
                    <button key={`r-${w.id}`} onClick={() => handleRight(w)}
                      disabled={matches[w.id]}
                      className={`w-full p-4 rounded-xl text-left font-medium transition-all ${
                        matches[w.id] ? 'bg-green-100 text-green-700 border-2 border-green-300' :
                        wrong === w.id ? 'bg-red-100 text-red-700 border-2 border-red-300' :
                        'bg-white hover:bg-vratnica-cream border-2 border-gray-200 hover:border-vratnica-teal'
                      }`}>{w.english}</button>
                  ))}
                </div>
              </div>
            </div>
          );
        };

        // Multiple Choice Quiz
        const MultipleChoice = ({ words, onComplete }) => {
          const [idx, setIdx] = useState(0);
          const [options, setOptions] = useState([]);
          const [selected, setSelected] = useState(null);
          const [correct, setCorrect] = useState(0);
          const [showResult, setShowResult] = useState(false);

          useEffect(() => {
            if (words?.length && words[idx]) {
              const wrongOptions = words.filter(w => w.id !== words[idx].id).sort(() => Math.random() - 0.5).slice(0, 3);
              const allOptions = [...wrongOptions, words[idx]].sort(() => Math.random() - 0.5);
              setOptions(allOptions);
            }
          }, [idx, words]);

          if (!words?.length) return (
            <div className="text-center py-12">
              <p className="text-vratnica-text/60 mb-4">No vocabulary available.</p>
              <button onClick={() => onComplete(10)} className="bg-vratnica-teal text-white px-6 py-3 rounded-xl">Continue</button>
            </div>
          );

          const word = words[idx];
          const handleSelect = (opt) => {
            setSelected(opt.id);
            setShowResult(true);
            const isCorrect = opt.id === word.id;
            if (isCorrect) setCorrect(c => c + 1);
            setTimeout(() => {
              setShowResult(false);
              setSelected(null);
              if (idx < words.length - 1) setIdx(idx + 1);
              else onComplete(correct * 5 + (isCorrect ? 5 : 0));
            }, 1500);
          };

          return (
            <div className="animate-fade-in" key={idx}>
              <div className="mb-4 flex justify-between text-sm text-vratnica-text/60">

                <span>{correct} correct</span>
              </div>
              <div className="w-full bg-gray-200 rounded-full h-2 mb-6">
                <div className="bg-vratnica-teal h-2 rounded-full transition-all" style={{width: `${((idx+1)/words.length)*100}%`}} />
              </div>
              <div className="bg-white rounded-2xl shadow-lg p-8 text-center mb-6">
                <div className="text-sm text-vratnica-text/50 mb-4">What does this mean?</div>
                <div className="font-display text-4xl text-vratnica-teal">{word?.vratnicki || word?.cyrillic}</div>
              </div>
              <div className="space-y-3">
                {options.map(opt => (
                  <button key={opt.id} onClick={() => !showResult && handleSelect(opt)}
                    disabled={showResult}
                    className={`w-full p-4 rounded-xl text-left font-medium transition-all ${
                      showResult && opt.id === word.id ? 'bg-green-100 text-green-700 border-2 border-green-300' :
                      showResult && selected === opt.id && opt.id !== word.id ? 'bg-red-100 text-red-700 border-2 border-red-300' :
                      'bg-white hover:bg-vratnica-cream border-2 border-gray-200'
                    }`}>{opt.english}</button>
                ))}
              </div>
            </div>
          );
        };

        // Fill in the Blank
        const FillBlank = ({ words, onComplete }) => {
          const [idx, setIdx] = useState(0);
          const [answer, setAnswer] = useState('');
          const [result, setResult] = useState(null);
          const [correct, setCorrect] = useState(0);
          const inputRef = useRef(null);

          useEffect(() => { inputRef.current?.focus(); }, [idx]);

          if (!words?.length) return (
            <div className="text-center py-12">
              <p className="text-vratnica-text/60 mb-4">No vocabulary available.</p>
              <button onClick={() => onComplete(10)} className="bg-vratnica-teal text-white px-6 py-3 rounded-xl">Continue</button>
            </div>
          );

          const word = words[idx];
          const check = () => {
            const isCorrect = answer.toLowerCase().trim() === word.english.toLowerCase().trim();
            setResult(isCorrect ? 'correct' : 'incorrect');
            if (isCorrect) setCorrect(c => c + 1);
            setTimeout(() => {
              setResult(null);
              setAnswer('');
              if (idx < words.length - 1) setIdx(idx + 1);
              else onComplete(correct * 5 + (isCorrect ? 5 : 0));
            }, 1500);
          };

          return (
            <div className="animate-fade-in" key={idx}>
              <div className="mb-4 flex justify-between text-sm text-vratnica-text/60">
                <span>Translate {idx + 1} of {words.length}</span>
                <span>{correct} correct</span>
              </div>
              <div className={`bg-white rounded-2xl shadow-lg p-8 text-center mb-6 transition-all ${
                result === 'correct' ? 'ring-4 ring-green-400' : result === 'incorrect' ? 'ring-4 ring-red-400' : ''
              }`}>
                <div className="text-sm text-vratnica-text/50 mb-4">Translate to English:</div>
                <div className="font-display text-4xl text-vratnica-teal mb-6">{word?.vratnicki || word?.cyrillic}</div>
                <input ref={inputRef} type="text" value={answer} onChange={e => setAnswer(e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && answer && check()}
                  placeholder="Type the English word..."
                  className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-center text-xl focus:outline-none focus:border-vratnica-teal"
                  disabled={result !== null} />
                {result && (
                  <div className={`mt-4 text-lg font-medium ${result === 'correct' ? 'text-green-600' : 'text-red-600'}`}>
                    {result === 'correct' ? 'Correct! Браво!' : `Answer: ${word.english}`}
                  </div>
                )}
              </div>
              <button onClick={check} disabled={!answer || result !== null}
                className="w-full bg-vratnica-teal hover:bg-vratnica-teal-dark disabled:bg-gray-300 text-white py-4 rounded-xl font-medium text-lg">
                Check Answer
              </button>
            </div>
          );
        };

        // Dialogue Exercise
        const DialogueExercise = ({ dialogueId, onComplete }) => {
          const [lineIdx, setLineIdx] = useState(0);
          const [showTrans, setShowTrans] = useState(false);
          const dialogue = COURSE_DIALOGUES[dialogueId];

          if (!dialogue) return (
            <div className="text-center py-12">
              <p className="text-vratnica-text/60 mb-4">Dialogue not found.</p>
              <button onClick={() => onComplete(10)} className="bg-vratnica-teal text-white px-6 py-3 rounded-xl">Continue</button>
            </div>
          );

          const line = dialogue.lines[lineIdx];
          return (
            <div className="animate-fade-in">
              <div className="text-center mb-6">
                <h3 className="font-display text-2xl text-vratnica-teal mb-2">{dialogue.title}</h3>
                <p className="text-vratnica-text/60 text-sm">{dialogue.context}</p>
              </div>
              <div className="w-full bg-gray-200 rounded-full h-2 mb-4">
                <div className="bg-vratnica-teal h-2 rounded-full transition-all" style={{width: `${((lineIdx+1)/dialogue.lines.length)*100}%`}} />
              </div>
              <div className="flex justify-center gap-6 mb-4">
                {dialogue.speakers.map((s, i) => (
                  <div key={i} className="flex items-center gap-2">
                    <div className="w-3 h-3 rounded-full" style={{backgroundColor: dialogue.speakerColors[i]}} />
                    <span className="text-sm text-vratnica-text/70">{s}</span>
                  </div>
                ))}
              </div>
              <div className="bg-white rounded-2xl shadow-lg p-6 mb-6 min-h-[280px]">
                <div className="space-y-4 max-h-[220px] overflow-y-auto">
                  {dialogue.lines.slice(0, lineIdx + 1).map((l, i) => (
                    <div key={i} className={`rounded-2xl p-3 max-w-[85%] ${l.speaker === 0 ? 'bg-vratnica-cream mr-auto rounded-bl-sm' : 'text-white ml-auto rounded-br-sm'}`}
                      style={l.speaker === 1 ? {backgroundColor: dialogue.speakerColors[1]} : {}}>
                      <div className="text-xs opacity-70 mb-1">{dialogue.speakers[l.speaker]}</div>
                      <div className="font-medium">{l.vratnicki}</div>
                      {(showTrans || i < lineIdx) && (
                        <div className="text-sm opacity-70 mt-1 border-t border-current/20 pt-1">{l.english}</div>
                      )}
                    </div>
                  ))}
                </div>
              </div>
              <div className="flex gap-3">
                <button onClick={() => setShowTrans(!showTrans)}
                  className="flex-1 py-3 rounded-xl border-2 border-vratnica-teal text-vratnica-teal font-medium hover:bg-vratnica-teal/5">
                  {showTrans ? 'Hide' : 'Show'} Translation
                </button>
                <button onClick={() => {
                  if (lineIdx < dialogue.lines.length - 1) { setLineIdx(lineIdx + 1); setShowTrans(false); }
                  else onComplete(dialogue.lines.length * 3);
                }} className="flex-1 bg-vratnica-teal hover:bg-vratnica-teal-dark text-white py-3 rounded-xl font-medium">
                  {lineIdx < dialogue.lines.length - 1 ? 'Next Line' : 'Complete'}
                </button>
              </div>
            </div>
          );
        };

        // Grammar Exercise
        const GrammarExercise = ({ grammarId, onComplete }) => {
          const grammar = COURSE_GRAMMAR_LESSONS[grammarId];
          if (!grammar) return (
            <div className="text-center py-12">
              <p className="text-vratnica-text/60 mb-4">Grammar lesson not found.</p>
              <button onClick={() => onComplete(10)} className="bg-vratnica-teal text-white px-6 py-3 rounded-xl">Continue</button>
            </div>
          );

          return (
            <div className="animate-fade-in">
              <div className="text-center mb-6">
                <h3 className="font-display text-2xl text-vratnica-teal mb-2">{grammar.title}</h3>
                <p className="text-vratnica-text/70">{grammar.explanation}</p>
              </div>
              <div className="bg-white rounded-2xl shadow-lg p-6 mb-6">
                <div className="overflow-x-auto">
                  <table className="w-full">
                    <thead>
                      <tr className="border-b-2 border-vratnica-cream">
                        {grammar.table[0] && Object.keys(grammar.table[0]).map(k => (
                          <th key={k} className="py-3 px-4 text-left text-sm font-medium text-vratnica-text/60 uppercase">{k}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {grammar.table.map((row, i) => (
                        <tr key={i} className="border-b border-gray-100">
                          {Object.values(row).map((v, j) => (
                            <td key={j} className="py-3 px-4 text-vratnica-text">{v}</td>
                          ))}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
              {grammar.examples && (
                <div className="bg-vratnica-cream/50 rounded-xl p-4 mb-6">
                  <div className="text-sm font-medium text-vratnica-teal mb-2">Examples:</div>
                  {grammar.examples.map((ex, i) => (
                    <div key={i} className="mb-2">
                      <span className="text-vratnica-teal font-medium">{ex.vratnicki}</span>
                      <span className="text-vratnica-text/60"> - {ex.english}</span>
                    </div>
                  ))}
                </div>
              )}
              {grammar.note && (
                <div className="bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-6">
                  <p className="text-sm text-yellow-800">{grammar.note}</p>
                </div>
              )}
              <button onClick={() => onComplete(15)}
                className="w-full bg-vratnica-teal hover:bg-vratnica-teal-dark text-white py-4 rounded-xl font-medium text-lg">
                I understand - Continue
              </button>
            </div>
          );
        };

        // Checkpoint Exercise (combines multiple categories)
        const CheckpointExercise = ({ lesson, onComplete }) => {
          const words = getWordsForLesson(lesson);
          return <MultipleChoice words={words} onComplete={onComplete} />;
        };

        // ========== RENDER LESSON ==========
        const renderLesson = () => {
          if (!activeLesson) return null;
          const handleComplete = (score) => {
            setExerciseScore(score);
            saveProgress(activeLesson.id, score);
            setLocalView('lesson-complete');
          };
          const words = getWordsForLesson(activeLesson);

          switch (activeLesson.type) {
            case 'vocabulary-intro': return <VocabIntro words={words} onComplete={handleComplete} />;
            case 'matching': return <MatchingExercise words={words} onComplete={handleComplete} />;
            case 'multiple-choice': return <MultipleChoice words={words} onComplete={handleComplete} />;
            case 'fill-blank': return <FillBlank words={words} onComplete={handleComplete} />;
            case 'dialogue': return <DialogueExercise dialogueId={activeLesson.dialogueId} onComplete={handleComplete} />;
            case 'grammar': return <GrammarExercise grammarId={activeLesson.grammarId} onComplete={handleComplete} />;
            case 'checkpoint': return <CheckpointExercise lesson={activeLesson} onComplete={handleComplete} />;
            default: return (
              <div className="text-center py-12">
                <p className="text-vratnica-text/60 mb-4">This lesson type is coming soon!</p>
                <button onClick={() => handleComplete(5)} className="bg-vratnica-teal text-white px-6 py-3 rounded-xl">Continue</button>
              </div>
            );
          }
        };

        // ========== MAIN RENDER ==========
        return (
          <div className="max-w-4xl mx-auto animate-fade-in">
            {/* Header with Back Navigation */}
            {localView !== 'overview' && (
              <button onClick={() => {
                if (localView === 'lesson' || localView === 'lesson-complete') { setLocalView('unit'); setActiveLesson(null); }
                else if (localView === 'unit') { setLocalView('section'); setActiveUnit(null); }
                else if (localView === 'section') { setLocalView('overview'); setActiveSection(null); }
              }} className="flex items-center gap-2 text-vratnica-text/60 hover:text-vratnica-teal mb-6">
                <span>←</span> Back
              </button>
            )}

            {/* Course Overview */}
            {localView === 'overview' && (
              <div>
                <div className="text-center mb-10">
                  <h1 className="font-display text-4xl text-vratnica-teal mb-4">{COURSE_STRUCTURE.title}</h1>
                  <p className="text-vratnica-text/70 max-w-2xl mx-auto">{COURSE_STRUCTURE.description}</p>
                </div>
                <div className="space-y-6">
                  {COURSE_STRUCTURE.sections.map((section, i) => {
                    const prog = getSectionProgress(section);
                    return (
                      <div key={section.id} onClick={() => { setActiveSection(section); setLocalView('section'); }}
                        className="bg-white rounded-2xl shadow-sm p-6 cursor-pointer hover:shadow-lg transition-all hover:-translate-y-1">
                        <div className="flex items-center justify-between mb-4">
                          <div className="flex items-center gap-4">
                            <div className="w-14 h-14 rounded-xl bg-gradient-to-br from-vratnica-teal to-vratnica-teal-dark flex items-center justify-center text-white text-xl font-bold">
                              {i + 1}
                            </div>
                            <div>
                              <h3 className="font-display text-xl text-vratnica-teal">{section.title}</h3>
                              <p className="text-sm text-vratnica-text/60">{section.description}</p>
                            </div>
                          </div>
                          <div className="text-2xl font-bold text-vratnica-teal">{prog}%</div>
                        </div>
                        <div className="w-full bg-gray-200 rounded-full h-2">
                          <div className="bg-gradient-to-r from-vratnica-teal to-vratnica-gold h-2 rounded-full transition-all" style={{width: `${prog}%`}} />
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* Section View */}
            {localView === 'section' && activeSection && (
              <div>
                <div className="text-center mb-8">
                  <h2 className="font-display text-3xl text-vratnica-teal mb-2">{activeSection.title}</h2>
                  <p className="text-vratnica-text/70">{activeSection.description}</p>
                </div>
                <div className="space-y-4">
                  {activeSection.units.map((unit, i) => {
                    const completed = unit.lessons?.filter(l => progress[l.id]?.completed).length || 0;
                    const total = unit.lessons?.length || 0;
                    const prevUnit = activeSection.units[i - 1];
                    const isLocked = i > 0 && prevUnit && !prevUnit.lessons?.every(l => progress[l.id]?.completed);
                    
                    return (
                      <div key={unit.id} onClick={() => !isLocked && (setActiveUnit(unit), setLocalView('unit'))}
                        className={`bg-white rounded-xl p-5 flex items-center gap-4 transition-all ${
                          isLocked ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer hover:shadow-md'
                        }`}>
                        <div className={`w-12 h-12 rounded-full flex items-center justify-center text-xl font-bold ${
                          unit.isCheckpoint ? 'bg-vratnica-gold text-white' : 'bg-vratnica-teal/10 text-vratnica-teal'
                        }`}>{unit.icon}</div>
                        <div className="flex-1">
                          <h4 className="font-medium text-vratnica-text">{unit.title}</h4>
                          <p className="text-sm text-vratnica-text/60">{unit.description}</p>
                        </div>
                        <div className="text-sm text-vratnica-text/60">
                          {isLocked ? 'Locked' : `${completed}/${total}`}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* Unit View */}
            {localView === 'unit' && activeUnit && (
              <div>
                <div className="text-center mb-8">
                  <h2 className="font-display text-2xl text-vratnica-teal mb-2">{activeUnit.title}</h2>
                  <p className="text-vratnica-text/70">{activeUnit.description}</p>
                </div>
                {activeUnit.culturalNote && (
                  <div className="bg-gradient-to-r from-vratnica-teal/10 to-vratnica-gold/10 rounded-xl p-4 mb-6">
                    <div className="text-sm font-medium text-vratnica-teal mb-1">{activeUnit.culturalNote.title}</div>
                    <p className="text-sm text-vratnica-text/70">{activeUnit.culturalNote.content}</p>
                  </div>
                )}
                <div className="space-y-3">
                  {activeUnit.lessons?.map((lesson, i) => {
                    const isComplete = progress[lesson.id]?.completed;
                    const prevLesson = activeUnit.lessons[i - 1];
                    const isLocked = i > 0 && prevLesson && !progress[prevLesson.id]?.completed;
                    
                    return (
                      <div key={lesson.id} onClick={() => !isLocked && (setActiveLesson(lesson), setLocalView('lesson'))}
                        className={`bg-white rounded-xl p-4 flex items-center gap-4 transition-all ${
                          isLocked ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer hover:shadow-md'
                        }`}>
                        <div className={`w-10 h-10 rounded-full flex items-center justify-center text-sm ${
                          isComplete ? 'bg-green-100 text-green-600' : 'bg-vratnica-cream text-vratnica-text/60'
                        }`}>{isComplete ? '✓' : i + 1}</div>
                        <div className="flex-1">
                          <h4 className="font-medium text-vratnica-text">{lesson.title}</h4>
                          <p className="text-xs text-vratnica-text/50 capitalize">{lesson.type.replace('-', ' ')}</p>
                        </div>
                        <button disabled={isLocked}
                          className={`px-4 py-2 rounded-lg text-sm font-medium ${
                            isLocked ? 'bg-gray-100 text-gray-400' :
                            isComplete ? 'bg-green-100 text-green-700' : 'bg-vratnica-teal text-white'
                          }`}>
                          {isLocked ? 'Locked' : isComplete ? 'Review' : 'Start'}
                        </button>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* Lesson View */}
            {localView === 'lesson' && activeLesson && (
              <div>{renderLesson()}</div>
            )}

            {/* Lesson Complete View */}
            {localView === 'lesson-complete' && (
              <div className="text-center py-12">
                <div className="text-6xl mb-6">🎉</div>
                <h2 className="font-display text-3xl text-vratnica-teal mb-4">Lesson Complete!</h2>
                <p className="text-vratnica-text/70 mb-2">You earned</p>
                <div className="text-5xl font-bold text-vratnica-gold mb-6">{exerciseScore} XP</div>
                <div className="space-y-3 max-w-xs mx-auto">
                  <button onClick={() => { setLocalView('unit'); setActiveLesson(null); }}
                    className="w-full bg-vratnica-teal hover:bg-vratnica-teal-dark text-white py-4 rounded-xl font-medium text-lg">
                    Continue
                  </button>
                  <button onClick={() => { setLocalView('lesson'); }}
                    className="w-full border-2 border-vratnica-teal text-vratnica-teal py-4 rounded-xl font-medium hover:bg-vratnica-teal/5">
                    Practice Again
                  </button>
                </div>
              </div>
            )}
          </div>
        );
      };

      
      // Research Page
      const ResearchPage = () => (
        <div className="max-w-4xl mx-auto animate-fade-in">
          <div className="text-center mb-8">
            <h1 className="font-display text-4xl text-vratnica-teal mb-4">Research & Resources</h1>
            <p className="text-vratnica-text/70">
              Academic research and resources about the Torlak dialect family
            </p>
          </div>

          <div className="space-y-6">
            {/* About Torlak */}
            <div className="bg-white rounded-2xl p-8 shadow-sm">
              <h2 className="font-display text-2xl text-vratnica-teal mb-4">About Torlak Dialects</h2>
              <p className="text-vratnica-text/80 leading-relaxed mb-4">
                Torlak (Торлачки) is a group of transitional South Slavic dialects spoken across southeastern Serbia, southern Kosovo, northwestern North Macedonia (including Jegunovce Municipality where Vratnički originates), and northwestern Bulgaria. UNESCO classifies Torlak as a "vulnerable" language on its list of endangered languages.
              </p>
              <p className="text-vratnica-text/80 leading-relaxed mb-4">
                The dialect occupies a unique position as a "bridge" between Eastern South Slavic (Bulgarian, Macedonian) and Western South Slavic (Serbian, Croatian). Yugoslav linguists traditionally classified it as an old Shtokavian dialect, while Bulgarian scholars classify it as a Western Bulgarian dialect. Modern linguists increasingly recognize it as part of the Balkan Sprachbund - a linguistic area where unrelated languages share features due to centuries of contact.
              </p>
              <div className="bg-vratnica-cream/50 rounded-lg p-4 mt-4">
                <p className="text-sm text-vratnica-text/70 italic">
                  "Torlak is well described in the traditional dialectological sense—its non-standard features have been listed and defined, starting from Belić (1905) and Stanojević (1911)." — Vuković et al., Language Resources and Evaluation, 2021
                </p>
              </div>
            </div>

            {/* Key Features */}
            <div className="bg-white rounded-2xl p-8 shadow-sm">
              <h2 className="font-display text-2xl text-vratnica-teal mb-4">Distinctive Linguistic Features</h2>
              <div className="grid md:grid-cols-2 gap-6">
                <div>
                  <h3 className="font-medium text-vratnica-text mb-2">Phonological</h3>
                  <ul className="text-vratnica-text/70 space-y-2 text-sm list-disc list-inside">
                    <li>Preservation of final -л (бил vs Serbian био)</li>
                    <li>Central vowel schwa (É™) in certain positions</li>
                    <li>Absence of /h/ phoneme (рекo vs рекох)</li>
                    <li>Final syllable stress possible (жена́)</li>
                    <li>Lack of phonetic pitch and length</li>
                  </ul>
                </div>
                <div>
                  <h3 className="font-medium text-vratnica-text mb-2">Grammatical</h3>
                  <ul className="text-vratnica-text/70 space-y-2 text-sm list-disc list-inside">
                    <li>Post-positive definite articles (-от, -та, -то)</li>
                    <li>Three-way demonstrative distinction</li>
                    <li>Loss of most noun cases</li>
                    <li>No infinitive forms (uses да + present)</li>
                    <li>Comparative with по- prefix</li>
                    <li>Clitic doubling constructions</li>
                  </ul>
                </div>
              </div>
            </div>

            {/* Balkan Sprachbund */}
            <div className="bg-gradient-to-r from-vratnica-teal/10 to-vratnica-red/10 rounded-2xl p-8">
              <h2 className="font-display text-2xl text-vratnica-teal mb-4">The Balkan Sprachbund</h2>
              <p className="text-vratnica-text/80 leading-relaxed mb-4">
                Torlak shares numerous features with Bulgarian, Macedonian, Albanian, Romanian, and Aromanian due to the Balkan Sprachbund - a set of structural convergences that developed through centuries of multilingual contact. Key shared features include:
              </p>
              <div className="grid md:grid-cols-3 gap-4 text-sm">
                <div className="bg-white/50 rounded-lg p-3">
                  <div className="font-medium text-vratnica-teal">Post-positive Articles</div>
                  <div className="text-vratnica-text/70">Shared with Bulgarian, Macedonian, Romanian, Albanian</div>
                </div>
                <div className="bg-white/50 rounded-lg p-3">
                  <div className="font-medium text-vratnica-teal">Loss of Infinitive</div>
                  <div className="text-vratnica-text/70">Shared with Bulgarian, Macedonian, Greek</div>
                </div>
                <div className="bg-white/50 rounded-lg p-3">
                  <div className="font-medium text-vratnica-teal">Analytic Case Marking</div>
                  <div className="text-vratnica-text/70">Prepositions replace noun cases</div>
                </div>
              </div>
            </div>

            {/* Research Papers */}
            <div className="bg-white rounded-2xl p-8 shadow-sm">
              <h2 className="font-display text-2xl text-vratnica-teal mb-4">Key Academic Resources</h2>
              <div className="space-y-4">
                {[
                  { title: 'Representing variation in a spoken corpus of an endangered dialect: the case of Torlak', author: 'Vuković, Samardžić, et al.', year: '2021', journal: 'Language Resources and Evaluation', url: 'https://link.springer.com/article/10.1007/s10579-020-09522-4' },
                  { title: 'Torlak: Areal Embedding and Linguistic Characteristics', author: 'Andrey N. Sobolev et al.', year: '2023', journal: 'Zeitschrift für Slavische Philologie, Band 79', url: 'https://www.academia.edu/122419806' },
                  { title: 'Under the Magnifying Glass: Dimensions of Variation in the Contemporary Timok Variety', author: 'Sobolev, Sonnenhauser', year: '2023', journal: 'Zeitschrift für Slavische Philologie 79(1)', url: null },
                  { title: 'Degrees of non-standardness: Feature-based analysis of variation in a Torlak dialect corpus', author: 'Vuković, Escher, Sonnenhauser', year: '2022', journal: 'International Journal of Corpus Linguistics 27(2)', url: null },
                  { title: 'A Corpus-Based Analysis of the Grammatical Status of Short Demonstratives in the Timok Dialect', author: 'Teodora Vuković', year: '2023', journal: 'Journal of Slavic Linguistics 31(1-2)', url: null },
                  { title: 'VarDial 2024: Dialect-COPA Task - Torlak Dataset', author: 'Chifu et al.', year: '2024', journal: 'VarDial Evaluation Campaign', url: 'https://sites.google.com/view/vardial-2024' },
                  { title: 'Natural Language Processing for Dialects of a Language: A Survey', author: 'Faisal et al.', year: '2024', journal: 'ACM Computing Surveys', url: 'https://dl.acm.org/doi/10.1145/3712060' },
                  { title: 'Torlak in the Slavic Family and Balkan Sprachbund: Linguistic Problems and Methodological Challenges', author: 'Andrey N. Sobolev', year: '2022', journal: 'Academia.edu', url: 'https://www.academia.edu/76128259' },
                  { title: 'Postposed Articles and DP Structures in Torlak', author: 'Živojinović, Azzolina, Girolami', year: '2021', journal: 'Balcania et Slavia', url: null },
                  { title: 'Clitic Doubling in the Balkan Languages', author: 'Kallulli, Tasmowski (eds.)', year: '2008', journal: 'John Benjamins Linguistics', url: 'https://benjamins.com/catalog/la.130' },
                  { title: 'Specificities in Object Clitic Doubling in Balkan Romance and Balkan Slavic', author: 'Various', year: '2023', journal: 'ResearchGate', url: 'https://www.researchgate.net/publication/378083113' },
                  { title: 'Variation in Clitic Doubling in Balkan Slavic', author: 'Olga Mišeska Tomić', year: '2006', journal: 'Dialectsyntax.org', url: 'http://www.dialectsyntax.org/mediawiki/images/0/02/Abstract_Tomic.pdf' },
