                              </span>
                              <span className="text-vratnica-text/60">→</span>
                              <span className="text-vratnica-text">{word?.english || 'Unknown word'}</span>
                            </div>
                            <div className="flex items-center gap-4">
                              <button
                                onClick={() => playingAudio === audio.id ? stopAudio() : playAudio(audio.url, audio.id)}
                                className={`flex items-center gap-2 px-3 py-1 rounded-full text-sm transition-all ${
                                  playingAudio === audio.id 
                                    ? 'bg-vratnica-red text-white' 
                                    : 'bg-white text-vratnica-teal border border-vratnica-teal hover:bg-vratnica-teal/10'
                                }`}
                              >
                                {playingAudio === audio.id ? 'â–  Stop' : 'â–º Play'}
                              </button>
                              <span className="text-xs text-vratnica-text/50">
                                Uploaded: {audio.uploadedAt ? new Date(audio.uploadedAt).toLocaleDateString() : 'Unknown'}
                              </span>
                            </div>
                          </div>
                          <div className="flex gap-2">
                            <button
                              onClick={() => approveAudio(audio.id)}
                              className="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg font-medium"
                            >
                              Approve
                            </button>
                            <button
                              onClick={() => deleteAudio(audio.id, audio.fileName)}
                              className="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg font-medium"
                            >
                              Delete
                            </button>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>

            {/* Approved Audio */}
            {approvedAudio.length > 0 && (
              <div className="bg-white rounded-2xl p-6 shadow-sm mb-8">
                <h2 className="font-display text-2xl text-vratnica-teal mb-4">
                  Approved Audio ({approvedAudio.length})
                </h2>
                <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-3 max-h-64 overflow-y-auto">
                  {approvedAudio.map((audio) => {
                    const word = getWordById(audio.wordId);
                    return (
                      <div key={audio.id} className="bg-green-50 border border-green-200 rounded-lg p-3 flex justify-between items-center">
                        <div className="flex-1 min-w-0">
                          <div className="font-medium text-vratnica-teal truncate">
                            {word?.vratnicki || word?.vratnica || '—'}
                          </div>
                          <div className="text-sm text-vratnica-text/70 truncate">{word?.english || 'Unknown'}</div>
                        </div>
                        <div className="flex gap-1 ml-2">
                          <button
                            onClick={() => playingAudio === audio.id ? stopAudio() : playAudio(audio.url, audio.id)}
                            className={`p-2 rounded-lg transition-all ${
                              playingAudio === audio.id 
                                ? 'bg-vratnica-red text-white' 
                                : 'bg-white text-vratnica-teal hover:bg-vratnica-teal/10'
                            }`}
                            title={playingAudio === audio.id ? 'Stop' : 'Play'}
                          >
                            {playingAudio === audio.id ? 'â– ' : 'â–º'}
                          </button>
                          <button
                            onClick={() => deleteAudio(audio.id, audio.fileName)}
                            className="p-2 rounded-lg bg-white text-red-500 hover:bg-red-50"
                            title="Delete"
                          >
                            Delete
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* Pending Submissions */}
            <div className="bg-white rounded-2xl p-6 shadow-sm mb-8">
              <h2 className="font-display text-2xl text-vratnica-teal mb-4">
                Pending Submissions ({pendingWords.length})
              </h2>
              {pendingWords.length === 0 ? (
                <p className="text-vratnica-text/50 text-center py-8">No pending submissions</p>
              ) : (
                <div className="space-y-4">
                  {pendingWords.map((word) => (
                    <div key={word.id} className="border border-yellow-200 bg-yellow-50 rounded-xl p-4">
                      <div className="flex justify-between items-start">
                        <div className="flex-1">
                          <div className="flex items-center gap-3 mb-2">
                            <span className="font-display text-xl text-vratnica-teal">{word.vratnicki || word.vratnica || "—"}</span>
                            <span className="text-vratnica-text">→</span>
                            <span className="text-vratnica-text">{word.english}</span>
                          </div>
                          <div className="text-sm text-vratnica-text/60">
                            Category: {word.category} | Level: {word.level}
                          </div>
                          {word.pronunciation && (
                            <div className="text-sm text-vratnica-text/50">/{word.notes}/</div>
                          )}
                          {word.example && (
                            <div className="text-sm text-vratnica-text/70 italic mt-2">"{word.notes}"</div>
                          )}
                        </div>
                        <div className="flex gap-2">
                          <button
                            onClick={() => approveWord(word.id)}
                            className="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg font-medium"
                          >
                            Approve
                          </button>
                          <button
                            onClick={() => startEditWord(word)}
                            className="bg-vratnica-teal hover:bg-vratnica-teal-dark text-white px-4 py-2 rounded-lg font-medium"
                          >
                            Edit
                          </button>
                          <button
                            onClick={() => deleteWord(word.id)}
                            className="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg font-medium"
                          >
                            Delete
                          </button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            {/* Approved Words */}
            <div className="bg-white rounded-2xl p-6 shadow-sm">
              <h2 className="font-display text-2xl text-vratnica-teal mb-4">
                Approved Words ({approvedWords.length})
              </h2>
              
              {/* Search/Filter */}
              <div className="mb-4">
                <input
                  type="text"
                  placeholder="Search words..."
                  className="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-vratnica-teal/50"
                  onChange={(e) => {
                    const search = e.target.value.toLowerCase();
                    document.querySelectorAll('[data-word-card]').forEach(card => {
                      const text = card.textContent.toLowerCase();
                      card.style.display = text.includes(search) ? '' : 'none';
                    });
                  }}
                />
              </div>
              
              <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-3 max-h-96 overflow-y-auto">
                {approvedWords.map((word) => (
                  <div key={word.id} data-word-card className="bg-vratnica-cream rounded-lg p-3">
                    <div className="flex justify-between items-start mb-2">
                      <div className="flex-1 min-w-0">
                        <div className="font-medium text-vratnica-teal truncate">{word.vratnicki || word.vratnica || "—"}</div>
                        <div className="text-sm text-vratnica-text/70 truncate">{word.english}</div>
                        <div className="text-xs text-vratnica-text/50">{word.category}</div>
                      </div>
                    </div>
                    <div className="flex gap-2">
                      <button
                        onClick={() => startEditWord(word)}
                        className="flex-1 text-xs bg-vratnica-teal/10 hover:bg-vratnica-teal/20 text-vratnica-teal px-2 py-1 rounded"
                      >
                        Edit
                      </button>
                      <button
                        onClick={() => deleteWord(word.id)}
                        className="flex-1 text-xs bg-red-50 hover:bg-red-100 text-red-500 px-2 py-1 rounded"
                      >
                        Delete
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
            
            {/* Edit Word Modal */}
            {editingWord && (
              <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50" onClick={(e) => e.target === e.currentTarget && cancelEdit()}>
                <div className="bg-white rounded-2xl p-6 max-w-lg w-full mx-4 animate-fade-in max-h-[90vh] overflow-y-auto" onClick={(e) => e.stopPropagation()}>
                  <h2 className="font-display text-2xl text-vratnica-teal mb-6">Edit Word</h2>
                  
                  <div className="space-y-4">
                    <div>
                      <label className="block text-sm font-medium text-vratnica-text/70 mb-1">English</label>
                      <input
                        type="text"
                        defaultValue={editFormRef.current.english}
                        onChange={(e) => { editFormRef.current.english = e.target.value; }}
                        className="w-full px-4 py-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-vratnica-teal/50"
                        autoFocus
                      />
                    </div>
                    
                    <div>
                      <label className="block text-sm font-medium text-vratnica-text/70 mb-1">Vratnički (Cyrillic)</label>
                      <input
                        type="text"
                        defaultValue={editFormRef.current.vratnicki}
                        onChange={(e) => { editFormRef.current.vratnicki = e.target.value; editFormRef.current.cyrillic = e.target.value; }}
                        className="w-full px-4 py-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-vratnica-teal/50 font-display text-lg"
                      />
                    </div>
                    
                    <div>
                      <label className="block text-sm font-medium text-vratnica-text/70 mb-1">Category</label>
                      <select
                        defaultValue={editFormRef.current.category}
                        onChange={(e) => { editFormRef.current.category = e.target.value; }}
                        className="w-full px-4 py-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-vratnica-teal/50"
                      >
                        <option value="">Select category...</option>
                        <option value="Greetings">Greetings</option>
                        <option value="Introduction">Introduction</option>
                        <option value="Politeness">Politeness</option>
                        <option value="Family">Family</option>
                        <option value="Numbers">Numbers</option>
                        <option value="Colors">Colors</option>
                        <option value="Food">Food</option>
                        <option value="Animals">Animals</option>
                        <option value="Body">Body Parts</option>
                        <option value="Nature">Nature</option>
                        <option value="House">House</option>
                        <option value="Professions">Professions</option>
                        <option value="Places">Places</option>
                        <option value="Time">Time</option>
                        <option value="Days & Time">Days & Time</option>
                        <option value="Verbs">Verbs</option>
                        <option value="Adjectives">Adjectives</option>
                        <option value="Adverbs">Adverbs</option>
                        <option value="Nouns">Nouns</option>
                        <option value="Work">Work</option>
                        <option value="Location">Location</option>
                        <option value="Culture">Culture</option>
                        <option value="Torlak Culture">Torlak Culture</option>
                        <option value="Torlak Expressions">Torlak Expressions</option>
                        <option value="Grammar">Grammar</option>
                        <option value="Expressions">Expressions</option>
                        <option value="Loanwords">Loanwords</option>
                        <option value="Archaic">Archaic</option>
                        <option value="Objects">Objects</option>
                        <option value="People">People</option>
                        <option value="Learning">Learning</option>
                        <option value="Contact">Contact</option>
                        <option value="Question Words">Question Words</option>
                        <option value="General">General</option>
                      </select>
                    </div>
                    
                    <div>
                      <label className="block text-sm font-medium text-vratnica-text/70 mb-1">Notes / Pronunciation</label>
                      <textarea
                        defaultValue={editFormRef.current.notes}
                        onChange={(e) => { editFormRef.current.notes = e.target.value; }}
                        rows={3}
                        className="w-full px-4 py-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-vratnica-teal/50"
                        placeholder="Pronunciation guide, usage notes, etc."
                      />
                    </div>
                  </div>
                  
                  <div className="flex gap-3 mt-6">
                    <button
                      onClick={saveEditedWord}
                      className="flex-1 bg-vratnica-teal hover:bg-vratnica-teal-dark text-white py-3 rounded-lg font-medium"
                    >
                      Save Changes
                    </button>
                    <button
                      onClick={cancelEdit}
                      className="flex-1 bg-gray-100 hover:bg-gray-200 text-vratnica-text py-3 rounded-lg font-medium"
                    >
                      Cancel
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      };

      // Admin Login Modal is rendered inline below to prevent re-render issues

      // ========================================
      // LOADING SCREEN
      // ========================================
      if (loading) {
        return (
          <div className="min-h-screen flex items-center justify-center">
            <div className="text-center">
              <Logo size="large" />
              <div className="mt-8">
                <div className="inline-block w-8 h-8 border-4 border-vratnica-teal border-t-transparent rounded-full animate-spin" />
              </div>
              <p className="mt-4 text-vratnica-text/60">Loading from Firebase...</p>
            </div>
          </div>
        );
      }

      // ========================================
      // MAIN RENDER
      // ========================================
      return (
        <div className="min-h-screen bg-vratnica-cream">
          <Navigation />
          <NotificationToast />
          
          {/* Admin Login Modal - Using refs to prevent re-renders */}
          {showAdminLogin && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
              <div className="bg-white rounded-2xl p-8 max-w-md w-full mx-4 animate-fade-in">
                <h2 className="font-display text-2xl text-vratnica-teal mb-6">🔐 Admin Login</h2>
                <div className="space-y-4">
                  <input
                    type="email"
                    ref={adminEmailRef}
                    defaultValue=""
                    className="w-full px-4 py-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-vratnica-teal/50"
                    placeholder="Email"
                    autoFocus
                  />
                  <input
                    type="password"
                    ref={adminPasswordRef}
                    defaultValue=""
                    onKeyPress={(e) => e.key === 'Enter' && handleAdminLogin()}
                    className="w-full px-4 py-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-vratnica-teal/50"
                    placeholder="Password"
                  />
                  <div className="flex gap-3">
                    <button
                      onClick={handleAdminLogin}
                      className="flex-1 bg-vratnica-teal hover:bg-vratnica-teal-dark text-white py-3 rounded-lg font-medium"
                    >
                      Login
                    </button>
                    <button
                      onClick={() => { 
                        setShowAdminLogin(false); 
                        if (adminEmailRef.current) adminEmailRef.current.value = '';
                        if (adminPasswordRef.current) adminPasswordRef.current.value = '';
                      }}
                      className="flex-1 bg-gray-100 hover:bg-gray-200 text-vratnica-text py-3 rounded-lg font-medium"
                    >
                      Cancel
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
          
          {/* Suggestion Modal */}
          {showSuggestionModal && suggestionWord && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
              <div className="bg-white rounded-2xl p-8 max-w-lg w-full mx-4 animate-fade-in max-h-[90vh] overflow-y-auto">
                <h2 className="font-display text-2xl text-vratnica-teal mb-2">Suggest a Change</h2>
                <p className="text-vratnica-text/60 mb-6">
                  Suggesting changes for: <strong>{suggestionWord.english}</strong>
                </p>
                
                <div className="space-y-4">
                  <div>
                    <label className="block text-sm font-medium text-vratnica-text/70 mb-1">
                      Current Vratnički: <span className="text-vratnica-teal">{suggestionWord.vratnicki || suggestionWord.vratnica || '—'}</span>
                    </label>
                    <input
                      type="text"
                      defaultValue={suggestionFormRef.current.suggestedVratnicki}
                      onChange={(e) => { suggestionFormRef.current.suggestedVratnicki = e.target.value; }}
                      className="w-full px-4 py-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-vratnica-teal/50"
                      placeholder="Suggested Vratnički spelling"
                    />
                  </div>
                  
                  <div>
                    <label className="block text-sm font-medium text-vratnica-text/70 mb-1">
                      Current Cyrillic: <span className="text-vratnica-teal">{suggestionWord.cyrillic || '—'}</span>
                    </label>
                    <input
                      type="text"
                      defaultValue={suggestionFormRef.current.suggestedCyrillic}
                      onChange={(e) => { suggestionFormRef.current.suggestedCyrillic = e.target.value; }}
                      className="w-full px-4 py-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-vratnica-teal/50"
                      placeholder="Suggested Cyrillic spelling"
                    />
                  </div>
                  
                  <div>
                    <label className="block text-sm font-medium text-vratnica-text/70 mb-1">
                      Current Notes: <span className="text-vratnica-text/50 text-xs">{suggestionWord.notes || '—'}</span>
                    </label>
                    <textarea
                      defaultValue={suggestionFormRef.current.suggestedNotes}
                      onChange={(e) => { suggestionFormRef.current.suggestedNotes = e.target.value; }}
                      rows={2}
                      className="w-full px-4 py-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-vratnica-teal/50"
                      placeholder="Suggested notes/pronunciation"
                    />
                  </div>
                  
                  <div>
                    <label className="block text-sm font-medium text-vratnica-text/70 mb-1">
                      Reason for Change <span className="text-red-500">*</span>
                    </label>
                    <textarea
                      defaultValue={suggestionFormRef.current.reason}
                      onChange={(e) => { suggestionFormRef.current.reason = e.target.value; }}
                      rows={3}
                      className="w-full px-4 py-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-vratnica-teal/50"
                      placeholder="Please explain why this change should be made (e.g., spelling correction, dialect variation, better pronunciation guide)"
                      required
                    />
                  </div>
                  
                  <div className="flex gap-3 mt-6">
                    <button
                      onClick={submitSuggestion}
                      className="flex-1 bg-vratnica-teal hover:bg-vratnica-teal-dark text-white py-3 rounded-lg font-medium"
                    >
                      Submit Suggestion
                    </button>
                    <button
                      onClick={() => {
                        setShowSuggestionModal(false);
                        setSuggestionWord(null);
                      }}
                      className="flex-1 bg-gray-100 hover:bg-gray-200 text-vratnica-text py-3 rounded-lg font-medium"
                    >
                      Cancel
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
          
          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            {currentPage === 'home' && <HomePage />}
            {currentPage === 'course' && <AITutorPage />}
            {currentPage === 'about' && <AboutPage />}
            {currentPage === 'contribute' && <ContributePage />}
            {currentPage === 'learn' && <LearnPage />}
            {currentPage === 'alphabet' && <AlphabetPage />}
            {currentPage === 'research' && <ResearchPage />}
            {currentPage === 'donate' && <DonatePage />}
            {currentPage === 'admin' && isAdmin && <AdminPage />}
          </main>

          {/* Footer */}
          <footer className="bg-white mt-16 py-8 border-t border-gray-100">
            <div className="max-w-7xl mx-auto px-4 text-center">
              <Logo size="small" />
              <p className="mt-4 text-vratnica-text/50 text-sm">
                Preserving the Vratnički dialect for future generations
              </p>
              <p className="mt-2 text-vratnica-text/40 text-xs">
                Founded by Chanel Stevanovich
              </p>
              <p className="mt-2 text-vratnica-text/30 text-xs">
                © 2025 Vratnica Project. Community-powered language preservation.
              </p>
            </div>
          </footer>
        </div>
      );
    }

    // Render App
    ReactDOM.render(<VratnicaApp />, document.getElementById('root'));
  </script>
</body>
</html>
